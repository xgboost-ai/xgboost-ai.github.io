---
layout: page
title: XGBoost Community Blog
nav_title: Blog
---
<ul class="post-list">
{% for post in site.posts %}
<li>
  <span class="post-meta">
    {{ post.date | date: "%b %-d, %Y" }}
  </span>
  <h3>
    <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
  </h3>
</li>
{% endfor %}
</ul>
