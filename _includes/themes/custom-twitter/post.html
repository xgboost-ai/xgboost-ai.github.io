<div class="container">
  <article class="content post">
    <header class="post-header">
      <h1>{{ page.title }} </h1>
      <p class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">
          {{ page.date | date: "%b %-d, %Y" }}
        </time>
        {% if page.author %}
        • <span>{{ page.author }}</span>
        {% endif %}
        {% if page.institution %}
        • <span>{{ page.institution }}</span>
        {% endif %}
      </p>
    </header>
    {{ content }}
  </article>
</div>
