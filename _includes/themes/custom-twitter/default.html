<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    {% if page.description %}<meta name="description" content="{{ page.description }}">{% endif %}
    {% if site.author.name %}<meta name="author" content="{{ site.author.name }}">{% endif %}

    <link href="{{ ASSET_PATH }}/css/style.css?body=1" rel="stylesheet" type="text/css" media="all">

    <link href="/images/logo/dmlc-logo-square.png" rel="icon" type="image/png">
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-75982049-3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){window.dataLayer.push(arguments);}

      gtag('js', new Date());
      gtag('config', 'UA-75982049-3');
    </script>
  </head>

  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-brand" href="/" aria-label="XGBoost home">
          <img src="/images/logo/xgboost-logo-trimmed.png" width="100" alt="XGBoost">
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <ul>
            {% assign pages_list = site.pages | sort:"order" %}
            {% assign group = 'navigation' %}
            {% include JB/pages_list %}
            <li><a href="https://xgboost.readthedocs.io">Docs</a></li>
            <li><a href="https://github.com/dmlc/xgboost/">GitHub</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      {{ content }}
    </main>
    {% include JB/analytics %}
  </body>
</html>
