---
layout: page
title: Posts by Tag
---
<ul>
{% for tag in site.tags %}
  <li><a href="#{{ tag[0] | slugify }}-ref">{{ tag[0] }}</a> ({{ tag[1].size }})</li>
{% endfor %}
</ul>

{% for tag in site.tags %}
  <h2 id="{{ tag[0] | slugify }}-ref">{{ tag[0] }}</h2>
  <ul>
  {% for post in tag[1] %}
    <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a> <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span></li>
  {% endfor %}
  </ul>
{% endfor %}
